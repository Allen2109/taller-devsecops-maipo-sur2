name: seguridad-planta
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Instalar herramientas verificadas
        run: |
          python scripts/install_tools.py
          python -m pip install --require-hashes -r tools/requirements.lock
          mkdir -p reports
          echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Gitleaks archivos
        id: secretos
        continue-on-error: true
        run: gitleaks dir --redact --config .gitleaks.toml --report-format json --report-path reports/gitleaks.json .
      - name: Gitleaks historial main
        id: historial
        continue-on-error: true
        run: gitleaks git --redact --config .gitleaks.toml --log-opts="origin/main" --report-format json --report-path reports/gitleaks-historial.json .
      - name: Semgrep codigo
        id: sast
        continue-on-error: true
        run: semgrep scan --metrics off --config .semgrep.yml --error --json --output reports/semgrep.json src scripts tests
      - name: Trivy dependencias
        id: sca
        continue-on-error: true
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-dependencias.json requirements.txt
      - name: OSV dependencias
        id: osv
        continue-on-error: true
        run: osv-scanner scan source --lockfile requirements.txt --format json --output reports/osv.json
      - name: Trivy infraestructura
        id: infra
        continue-on-error: true
        run: trivy config --config-check policies/ --check-namespaces builtin,user --misconfig-scanners terraform,yaml --rego-error-limit 0 --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/trivy-infra.json infra/
      - name: Generar SBOM CycloneDX
        id: sbom
        continue-on-error: true
        run: trivy fs --format cyclonedx --output reports/sbom.cdx.json requirements.txt
      - name: Comprobar que las reglas detectan los defectos
        id: negativos
        continue-on-error: true
        run: python scripts/pruebas_controles.py
      - name: Guardar informes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seguridad-${{ github.sha }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
      - name: Compuerta obligatoria
        if: always()
        env:
          RESULTADOS: '${{ steps.secretos.outcome }},${{ steps.historial.outcome }},${{ steps.sast.outcome }},${{ steps.sca.outcome }},${{ steps.osv.outcome }},${{ steps.infra.outcome }},${{ steps.sbom.outcome }},${{ steps.negativos.outcome }}'
        run: |
          python - <<'PYCODE'
          import os
          resultados = os.environ['RESULTADOS'].split(',')
          if any(r != 'success' for r in resultados):
              raise SystemExit('Seguridad bloqueada: hay controles fallidos o sin ejecutar')
          print('Todos los controles obligatorios terminaron correctamente')
          PYCODE
